[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-erasure"
description = "Controller-signed erasure over a signed audit chain: sweep, composite tombstone, pending markers for sealed stores, a ledger that refuses re-ingestion."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "Loomground Contributors" }]
# audit-chain: the chain the erasure purges and the legal-basis alphabet.
# lock: seal state and the unseal hooks pending markers ride on.
# governance: the verdict vocabulary the three states are read in.
# workspace: the registry pending_erase walks for sealed descendants.
# cryptography: Ed25519 marker signatures (through audit-chain signing).
# First-party siblings are direct git references, not ranges: no index serves this
# family. Each ref is the release tag loomground's RELEASES.json records, and the full
# transitive closure is declared, because those tagged commits still carry ranges that
# only these URLs can satisfy.
dependencies = [
    "loomground-audit-chain @ git+https://github.com/flxk1/loomground-audit-chain@loomground-audit-chain-v0.1.0",
    "loomground-lock @ git+https://github.com/flxk1/loomground-lock@loomground-lock-v0.2.0",
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@loomground-governance-v0.11.1",
    "loomground-workspace @ git+https://github.com/flxk1/loomground-workspace@v0.1.0",
    "cryptography>=41.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/flxk1/loomground-erasure"
Repository = "https://github.com/flxk1/loomground-erasure"
Issues = "https://github.com/flxk1/loomground-erasure/issues"

[tool.setuptools.dynamic]
version = { attr = "loomground_erasure._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_erasure*"]

[tool.setuptools.package-data]
loomground_erasure = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
